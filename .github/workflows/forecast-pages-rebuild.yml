name: Validate deployed forecast

# The NAS cron is the single source of truth: it generates forecasts and pushes
# the JSON into web/public/ (see scripts/shell/push_forecast.sh), which is the
# directory Cloudflare Pages deploys. This workflow does NOT regenerate or
# commit anything -- it only validates that what's in web/public/ is well-formed
# so a bad commit can't silently ship a broken site.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "web/public/**"
  push:
    branches: [master]
    paths:
      - "web/public/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate web/public is deployable
        run: python scripts/ci/validate_public.py
